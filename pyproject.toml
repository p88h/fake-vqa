[project]
name = "fakevqa"
version = "0.2.0"
description = "Synthetic document VQA benchmark for vision-language models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "faker>=37.1.0",
    "httpx>=0.27",
    "numpy>=2.3.5",
    "openai>=1.60",
    "pillow>=11.1.0",
    "rapidfuzz>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# In-process vLLM backend (`-M vllm-local:<model>`); needs a CUDA box in practice.
vllm = ["vllm>=0.32"]
# fakevqa_finetune.py
finetune = ["unsloth", "trl", "transformers"]

[tool.uv]
package = false
